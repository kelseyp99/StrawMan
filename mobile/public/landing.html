<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get StrawMan App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #222; margin: 0; padding: 0; }
    .container { max-width: 480px; margin: 4em auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px #0001; padding: 2em; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5em; }
    p { font-size: 1.1rem; margin-bottom: 2em; }
    .store-links { display: flex; justify-content: center; gap: 2em; margin-bottom: 2em; }
    .store-link img { width: 140px; height: auto; transition: transform 0.1s; }
    .store-link img:hover { transform: scale(1.05); }
    .contact { font-size: 0.95rem; color: #555; margin-top: 2em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Get the StrawMan App</h1>
    <p>Download StrawMan from your favorite app store:</p>
    <div class="store-links">
      <a class="store-link" href="https://play.google.com/store/apps/details?id=com.yourcompany.strawman" target="_blank" rel="noopener">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
      </a>
      <a class="store-link" href="https://apps.apple.com/app/idYOUR_APPLE_ID" target="_blank" rel="noopener">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
    </div>
    <div class="contact">
      Need help? Contact <a href="mailto:lifelog42@gmail.com">lifelog42@gmail.com</a>
    </div>
  </div>
</body>
</html>
