<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsored Advertisement</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .ad-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px 32px;
      text-align: center;
      max-width: 400px;
    }
    .ad-title {
      font-size: 2rem;
      color: #1976d2;
      margin-bottom: 16px;
    }
    .ad-message {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 24px;
    }
    .ad-cta {
      display: inline-block;
      background: #1976d2;
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .ad-cta:hover {
      background: #125ea2;
    }
  </style>
</head>
<body>
  <div class="ad-container">
    <div class="ad-title">Sponsored Ad</div>
    <div class="ad-message">Thank you for clicking our sponsor banner!<br />This is a sample advertising landing page.</div>
    <a class="ad-cta" href="/" >Back to Home</a>
  </div>
</body>
</html>
